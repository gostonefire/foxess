[package]
name = "foxess"
version = "0.2.3"
description = "Rust library for communication with FoxESS Cloud"
homepage = "https://github.com/gostonefire/foxess"
repository = "https://github.com/gostonefire/foxess"
documentation = "https://docs.rs/foxess"
keywords = ["foxess", "photovoltaic", "inverter", "battery", "home-automation"]
categories = ["api-bindings", "web-programming::http-client", "network-programming", "asynchronous"]
readme = "README.md"
license-file = "LICENSE"
edition = "2024"
rust-version = "1.88.0"

[features]
default = ["async"]
async = ["dep:reqwest"]
blocking = ["dep:reqwest", "reqwest/blocking"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["query", "form", "rustls"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = {  version = "0.4", features = ["serde"] }
md-5 = "0.10.6"

[dev-dependencies]
tokio = { version = "1.49", features = ["macros", "rt"] }
httpmock = "0.8"

[package.metadata.docs.rs]
features = ["async"]
rustdoc-args = ["--cfg", "docsrs"]
